# Each active cohort is rebuilt by an immutable Galaxy producer on every tool
# publish. Consumers map the stable store alias in shed_tool_conf.xml to the
# cohort compatible with their Galaxy release.
declare -g -A TOOL_SOURCE_STORE_PRODUCERS=(
    # [v1]='pypi:26.2.0'
    # [v2]='git:https://github.com/galaxyproject/galaxy.git@FULL_40_CHARACTER_SHA'
)

# A frozen cohort is retained and validated, but not rebuilt. Freeze a cohort
# only after all consumers that need it are pinned to its immutable artifact.
declare -g -a FROZEN_TOOL_SOURCE_STORE_COHORTS=()

TOOL_SOURCE_STORE_PARALLEL=16
